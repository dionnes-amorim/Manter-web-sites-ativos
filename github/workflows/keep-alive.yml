name: Keep Alive WebServices

on:
  schedule:
    # GitHub Actions uses UTC. Runs every 10 minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping configured services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Ping WebServices
        env:
          KEEPALIVE_URLS: ${{ secrets.KEEPALIVE_URLS }}
        run: python keep_alive.py
